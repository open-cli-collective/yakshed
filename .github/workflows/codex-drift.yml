name: Codex drift

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check latest Codex schema
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_codex_drift.py 2>&1 | tee codex-drift-report.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Codex drift report"
            echo
            echo '```text'
            cat codex-drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
