name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cheap-lane:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p yakshed-secrets --features dev-secrets --locked
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo check -p yakshed-secrets --features dev-secrets --target x86_64-pc-windows-msvc --locked
      - run: cargo run -p yakshed-contract-host --locked -- --version
      - run: python3 scripts/backend_contract_test.py --host target/debug/yakshed-contract-host --fake-harness scripts/fake_harness.py
      - run: python3 scripts/verify_schema_pin.py
