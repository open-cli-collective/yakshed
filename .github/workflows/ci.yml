name: CI

on:
  push:
    branches:
      - main
      - rebuild/provider-neutral-workbench
      - "rebuild/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: yakshed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm install --global npm@11.19.0
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:frontend
      - run: npm run test:shell
      - run: npm run test:syntax
      - run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  macos:
    name: macOS package smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm install --global npm@11.19.0
      - run: python -m pip install -r backend/requirements.txt PyInstaller==6.16.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:frontend
      - run: npm run test:syntax
      - name: Freeze service sidecar
        run: |
          test -f scripts/freeze_service.py
          python scripts/freeze_service.py --output backend/dist/yakshed-service
          test -x backend/dist/yakshed-service
      - run: npm run package
      - run: npm run package:smoke
