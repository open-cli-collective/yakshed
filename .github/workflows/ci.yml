name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cheap-lane:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/yakshed-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: crates/yakshed-tauri
      - run: npm run typecheck
        working-directory: crates/yakshed-tauri
      - run: npm run build
        working-directory: crates/yakshed-tauri
      - run: npx playwright install --with-deps chromium
        working-directory: crates/yakshed-tauri
      - run: npm run test:e2e
        working-directory: crates/yakshed-tauri
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p yakshed-tauri -p yakshed-desktop -p yakshed-secrets --target x86_64-unknown-linux-gnu --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p yakshed-secrets --features dev-secrets --locked
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo check -p yakshed-secrets --features dev-secrets --target x86_64-pc-windows-msvc --locked
      - run: cargo run -p yakshed-contract-host --locked -- --version
      - run: python3 scripts/backend_contract_test.py --host target/debug/yakshed-contract-host --fake-harness scripts/fake_harness.py
      - run: python3 scripts/verify_schema_pin.py
      - run: python3 scripts/verify_codex_metadata.py
      - run: python3 scripts/check_codex_drift.py --self-test
      - run: python3 scripts/repin_codex.py --self-test

  macos-lane:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/yakshed-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: crates/yakshed-tauri
      - run: cargo test --workspace --locked
      - run: cargo test -p yakshed-secrets --features keychain-integration --test keychain_integration --locked
      - run: npm run package
        working-directory: crates/yakshed-tauri
      # GitHub-hosted macOS runners do not guarantee the interactive GUI session
      # required by the osascript quit check; tauri_app_smoke.py remains a local gate.
