name: config-ipc
description: Reviews YakShed Tauri configuration, commands, events, capabilities, CSP, updater, and WebView-to-Rust boundaries.
model_tier: medium
effort: high
file_globs:
  - "crates/yakshed-desktop/tauri.conf.json"
  - "crates/yakshed-tauri/Cargo.toml"
  - "crates/yakshed-tauri/build.rs"
  - "crates/yakshed-tauri/src/lib.rs"
  - "crates/yakshed-tauri/src/macos.rs"
  - "crates/yakshed-tauri/src/roster.rs"
  - "crates/yakshed-tauri/src/frontend/client.ts"
  - "crates/yakshed-tauri/tests/**"
  - "crates/yakshed-desktop-api/**"
applies_when:
  - A change edits Tauri configuration, command/event handlers, the desktop facade, capabilities, permissions, plugins, CSP, sidecars, windows, updater, or frontend/backend DTOs.
  - Do not select for pure domain, persistence, provider-protocol, or Rust-idiom changes that do not alter the desktop boundary.
required_on_match: true
needs_full_file_content: false
