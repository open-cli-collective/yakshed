[package]
name = "yakshed-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
dev-secrets = [
    "dep:atomic-write-file",
    "dep:serde",
    "dep:serde_json",
]
keychain-integration = []

[dependencies]
async-trait.workspace = true
atomic-write-file = { workspace = true, optional = true }
libc.workspace = true
secrecy.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
yakshed-application.workspace = true
yakshed-domain.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "keychain_integration"
required-features = ["keychain-integration"]
