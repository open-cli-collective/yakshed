[workspace]
members = [
    "crates/provider-codex",
    "crates/provider-mock",
    "crates/yakshed-application",
    "crates/yakshed-desktop-api",
    "crates/yakshed-domain",
    "crates/yakshed-harness",
    "crates/yakshed-secrets",
    "crates/yakshed-store",
    "tools/yakshed-contract-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
atomic-write-file = "=0.3.0"
directories = "=6.0.0"
provider-mock = { path = "crates/provider-mock" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
toml = "=1.1.4"
uuid = { version = "=1.24.0", features = ["serde"] }
yakshed-application = { path = "crates/yakshed-application" }
yakshed-desktop-api = { path = "crates/yakshed-desktop-api" }
yakshed-domain = { path = "crates/yakshed-domain" }
yakshed-harness = { path = "crates/yakshed-harness" }
yakshed-secrets = { path = "crates/yakshed-secrets" }
yakshed-store = { path = "crates/yakshed-store" }
